<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV Store</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./tp_pagamentos.html">Tipos de Pagamento</a>
        <a href="./formaPagamento">Forma de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>

    </nav>

    <main class="conteudo">

        <div class="cabecalho">

            <h2>Clientes</h2>

            <button id="abrirCadastro" class="botao">
                Novo Cliente
            </button>

        </div>

        <section class="listaClientes">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="tabelaClientes">

                    <tr>

                        <td>1</td>
                        <td>João Silva</td>
                        <td>(31) 99999-9999</td>
                        <td>Belo Horizonte</td>

                        <td>

                            <button class="editar">Editar</button>

                            <button class="excluir">Excluir</button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <div class="modal" id="modalCadastro">

        <div class="conteudoModal">

            <span id="fecharCadastro">&times;</span>

            <h2>Novo Cliente</h2>

            <form class="formCad">

                <label for="nome">Nome</label>
                <input type="text" id="nome">

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco">

                <label for="email">E-mail</label>
                <input type="email" id="email">

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone">

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade">

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro">

                <label for="cep">CEP</label>
                <input type="text" id="cep">

                <label for="cpf">CPF</label>
                <input type="text" id="cpf">

                <label for="obs">Observações</label>
                <textarea id="obs"></textarea>

                <div class="botoesForm">

                    <button  id="cancelar" onclick="">
                        Cancelar
                    </button>

                    <button type="submit" class="formBotao" onclick="">
                        Cadastrar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/index.js"></script>

</body>

</html>
