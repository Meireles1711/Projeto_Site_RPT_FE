<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV Store</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>
        <a href="./items.html">Items Pedidos</a>
        <a href="./produtos.html">Produtos</a>

    </nav>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Clientes</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Cliente</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Cidade</th>
                <th>Telefone</th>
                <th>E-mail</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Cliente</h2>
            <Label>Nome</Label>
            <input id="nomeAdd">
            <Label>Endereço</Label>
            <input id="enderecoAdd">
            <Label>Bairro</Label>
            <input id="bairroAdd">
            <Label>CEP</Label>
            <input id="cepAdd">
            <Label>Cidade id</Label>
            <input id="cidadeAdd">
            <Label>CPF</Label>
            <input id="cpfAdd">
            <Label>E-mail</Label>
            <input id="emailAdd">
            <Label>Telefone</Label>
            <input id="telefoneAdd">
            <Label>Observações</Label>
            <textarea id="obsAdd"></textarea>

            <div class="modal-buttons">
                <button onclick="fecharModal('modalAdicionar')">Cancelar</button>
                <button onclick="criar()">Salvar</button>
            </div>

        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Cliente</h2>
        <input id="idEdit" hidden>

        <Label>Nome</Label>
        <input id="nomeEdit">
        <Label>Endereço</Label>
        <input id="enderecoEdit">
        <Label>Bairro</Label>
        <input id="bairroEdit">
        <Label>CEP</Label>
        <input id="cepEdit">
        <Label>Cidade id</Label>
        <input id="cidadeEdit">
        <Label>CPF</Label>
        <input id="cpfEdit">
        <Label>E-mail</Label>
        <input id="emailEdit">
        <Label>Telefone</Label>
        <input id="telefoneEdit">
        <Label>Observações</Label>
        <textarea id="obsEdit"></textarea>

        <div class="modal-buttons">
            <button onclick="fecharModal('modalEditar')">Cancelar</button>
            <button onclick="atualizar()">Atualizar</button>
        </div>

    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../java/clientes.js"></script>

</body>

</html>
