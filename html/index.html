    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html" class="active">Clientes</a>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Clientes</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Cliente</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th class="col-principal">Nome</th>
                <th>CPF</th>
                <th>Cidade</th>
                <th>Telefone</th>
                <th>E-mail</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar" role="dialog" aria-modal="true" aria-labelledby="modalAdicionarTitulo">
        <div class="modal-content">
            <h2 id="modalAdicionarTitulo">Adicionar Cliente</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <label for="nomeAdd">Nome</label>
                <input id="nomeAdd" type="text" maxlength="100" required placeholder="Nome completo">

                <label for="cpfAdd">CPF</label>
                <input id="cpfAdd" type="text" inputmode="numeric" maxlength="14"
                    pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" placeholder="000.000.000-00" required
                    title="Informe um CPF válido (somente números ou no formato 000.000.000-00)">

                <label for="emailAdd">E-mail</label>
                <input id="emailAdd" type="email" maxlength="100" placeholder="nome@exemplo.com">

                <label for="telefoneAdd">Telefone</label>
                <input id="telefoneAdd" type="tel" inputmode="numeric" maxlength="15"
                    pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}" placeholder="(00) 00000-0000"
                    title="Informe um telefone válido, ex: (00) 00000-0000">

                <!-- Select alimentado via JS a partir da lista de cidades cadastradas -->
                <label for="cidadeAdd">Cidade</label>
                <select id="cidadeAdd" required>
                    <option value="" selected disabled>Selecione uma cidade...</option>
                </select>

                <label for="cepAdd">CEP</label>
                <input id="cepAdd" type="text" inputmode="numeric" maxlength="9"
                    pattern="\d{5}-?\d{3}" placeholder="00000-000"
                    title="Informe um CEP válido, ex: 00000-000">

                <label class="full" for="enderecoAdd">Endereço</label>
                <input class="full" id="enderecoAdd" type="text" maxlength="150" placeholder="Rua, número">

                <label class="full" for="bairroAdd">Bairro</label>
                <input class="full" id="bairroAdd" type="text" maxlength="80">

                <label class="full" for="obsAdd">Observações</label>
                <textarea class="full" id="obsAdd" maxlength="500"></textarea>

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitulo">
        <div class="modal-content">
        <h2 id="modalEditarTitulo">Editar Cliente</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label for="nomeEdit">Nome</label>
            <input id="nomeEdit" type="text" maxlength="100" required>

            <label for="cpfEdit">CPF</label>
            <input id="cpfEdit" type="text" inputmode="numeric" maxlength="14"
                pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" required
                title="Informe um CPF válido (somente números ou no formato 000.000.000-00)">

            <label for="emailEdit">E-mail</label>
            <input id="emailEdit" type="email" maxlength="100">

            <label for="telefoneEdit">Telefone</label>
            <input id="telefoneEdit" type="tel" inputmode="numeric" maxlength="15"
                pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
                title="Informe um telefone válido, ex: (00) 00000-0000">

            <label for="cidadeEdit">Cidade</label>
            <select id="cidadeEdit" required>
                <option value="" selected disabled>Selecione uma cidade...</option>
            </select>

            <label for="cepEdit">CEP</label>
            <input id="cepEdit" type="text" inputmode="numeric" maxlength="9"
                pattern="\d{5}-?\d{3}" title="Informe um CEP válido, ex: 00000-000">

            <label class="full" for="enderecoEdit">Endereço</label>
            <input class="full" id="enderecoEdit" type="text" maxlength="150">

            <label class="full" for="bairroEdit">Bairro</label>
            <input class="full" id="bairroEdit" type="text" maxlength="80">

            <label class="full" for="obsEdit">Observações</label>
            <textarea class="full" id="obsEdit" maxlength="500"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/clientes.js"></script>

</body>

</html>
