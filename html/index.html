        <div class="conteiner">
    
        <div class="card">
    
        <div class="topo">
        <h1>Clientes</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Cliente</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Endereço</th>
                <th>Bairro</th>
                <th>CEP</th>
                <th>Cidade</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Observações</th>
                
            </tr>
        </thead>
    
        <tbody id="tabelaTipos">
    
        </tbody>
    </table>
    </div>
    </div>
    
    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Cliente</h2>
            <Label>Nome</Label>
            <input id="nomeAdd">

            <Label>Endereço</Label>
            <input id="enderecoAdd">

            <Label>Bairro</Label>
            <input id="bairroAdd">

            <Label>CEP</Label>
            <input id="cepAdd">

            <Label>Cidade</Label>
            <input id="cidadeAdd">

            <Label>CPF</Label>
            <input id="cpfAdd">
            

            <Label>Email</Label>
            <input id="emailAdd">

            <Label>Telefone</Label>
            <input id="telefoneAdd">

            <Label>Observações</Label>
            <input id="observacoesAdd">
    
           
    
           
    
            <div class="modal-buttons">
                <button onclick="fecharModal('modalAdicionar')">Cancelar</button>
                <button onclick="criar()">Salvar</button>    
            </div>
    
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Cliente</h2>
        <input id="idEdit" hidden>
    
        <Label>Nome</Label>
        <input id="nomeEdit">

        <Label>Endereço</Label>
        <input id="enderecoEdit">

        <Label>Bairro</Label>
        <input id="bairroEdit">

        <Label>CEP</Label>
        <input id="cepEdit">

        <Label>Cidade</Label>
        <input id="cidadeEdit">

        <Label>CPF</Label>
        <input id="cpfEdit">

        <Label>Email</Label>
        <input id="emailEdit">

        <Label>Telefone</Label>
        <input id="telefoneEdit">

        <Label>Observações</Label>
        <input id="observacoesEdit">
       
    
        <div class="modal-buttons">
            <button onclick="fecharModal('modalEditar')">Cancelar</button>
            <button onclick="atualizar()">Atualizar</button>
        </div>
    
    </div>
    </div>
