<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NV Store</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Bem-vindo de volta</h2>
      <p class="subtitle">Acesse sua conta para continuar</p>
      <div id="alert-message" class="alert hidden"></div>
      <form id="form-login" novalidate>
        <div class="input-group">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" placeholder="Seu nome de usuário" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <div class="auth-footer">
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
