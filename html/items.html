        <div class="conteiner">
    
        <div class="card">
    
        <div class="topo">
        <h1>Items Pedidos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Items Pedidos</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Pedido</th>
                <th>Produto</th>
                
                <th>Descrição</th>
                <th>Valor Unitario</th>
                <th>Quantidade</th>
                <th>Subtotal</th>
                
            </tr>
        </thead>
    
        <tbody id="tabelaTipos">
    
        </tbody>
    </table>
    </div>
    </div>
    
    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Itens Pedidos</h2>
            <Label>Pedido</Label>
            <input id="pedidoAdd">

            <Label>Produto</Label>
            <input id="produtoAdd">

            <Label>Descrição</Label>
            <input id="descricaoAdd">

            <Label>Valor Unitario</Label>
            <input id="valorAdd">

            <Label>Quantidade</Label>
            <input id="quantidadeAdd">

            <Label>Subtotal</Label>
            <input id="subtotalAdd">

    
           
    
            <div class="modal-buttons">
                <button onclick="fecharModal('modalAdicionar')">Cancelar</button>
                <button onclick="criar()">Salvar</button>    
            </div>
    
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Itens Pedidos</h2>
        <input id="idEdit" hidden>

        <Label>Pedido</Label>
        <input id="pedidoEdit">
        
        <Label>Produto</Label>
        <input id="produtoEdit">
    
        <Label>Descrição</Label>
        <input id="descricaoEdit">

        <Label>Valor Unitario</Label>
        <input id="valorEdit">
    
        <Label>Quantidade</Label>
        <input id="quantidadeEdit">

        <Label>Subtotal</Label>
        <input id="subtotalEdit">
    
        <div class="modal-buttons">
            <button onclick="fecharModal('modalEditar')">Cancelar</button>
            <button onclick="atualizar()">Atualizar</button>
        </div>
    
    </div>
    </div>
