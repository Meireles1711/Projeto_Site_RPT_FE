<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV Store</title>

    <link rel="stylesheet" href="../css/items.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>
        <a href="./items.html" class="active">Items Pedidos</a>
        <a href="./produtos.html">Produtos</a>

    </nav>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Items Pedidos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Item</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>Pedido</th>
                <th>Produto</th>
                <th class="col-principal">Descrição</th>
                <th>Valor Unitário</th>
                <th>Quantidade</th>
                <th>Subtotal</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Item Pedido</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <!-- Selects alimentados via JS a partir das listas já cadastradas -->
                <label>Pedido</label>
                <select id="pedidoAdd" required>
                    <option value="" selected disabled>Selecione um pedido...</option>
                </select>

                <label>Produto</label>
                <select id="produtoAdd" required>
                    <option value="" selected disabled>Selecione um produto...</option>
                </select>

                <label class="full">Descrição</label>
                <input class="full" id="descricaoAdd" type="text" maxlength="150">

                <label>Valor Unitário</label>
                <input id="valorAdd" type="number" min="0" step="0.01" inputmode="decimal" required>

                <label>Quantidade</label>
                <input id="quantidadeAdd" type="number" min="1" step="1" inputmode="numeric" required>

                <label>Subtotal</label>
                <input id="subtotalAdd" type="number" min="0" step="0.01" inputmode="decimal" readonly>

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Item Pedido</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label>Pedido</label>
            <select id="pedidoEdit" required>
                <option value="" selected disabled>Selecione um pedido...</option>
            </select>

            <label>Produto</label>
            <select id="produtoEdit" required>
                <option value="" selected disabled>Selecione um produto...</option>
            </select>

            <label class="full">Descrição</label>
            <input class="full" id="descricaoEdit" type="text" maxlength="150">

            <label>Valor Unitário</label>
            <input id="valorEdit" type="number" min="0" step="0.01" inputmode="decimal" required>

            <label>Quantidade</label>
            <input id="quantidadeEdit" type="number" min="1" step="1" inputmode="numeric" required>

            <label>Subtotal</label>
            <input id="subtotalEdit" type="number" min="0" step="0.01" inputmode="decimal" readonly>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/items.js"></script>

</body>

</html>
