<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/produtos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>
        <a href="./items.html">Itens de Pedidos</a>
        <a href="./produtos.html" class="active">Produtos</a>


    </nav>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Produtos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Produto</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th class="col-principal">Descrição</th>
                <th>Valor Unitário</th>
                <th>Estoque</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar" role="dialog" aria-modal="true" aria-labelledby="modalAdicionarTitulo">
        <div class="modal-content">
            <h2 id="modalAdicionarTitulo">Adicionar Produto</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <label class="full" for="descricaoAdd">Descrição</label>
                <input class="full" id="descricaoAdd" type="text" maxlength="100" required
                    placeholder="Nome do produto">

                <label for="unidadeAdd">Unidade</label>
                <input id="unidadeAdd" type="text" maxlength="10" placeholder="UN, KG, CX...">

                <label for="valorAdd">Valor Unitário</label>
                <input id="valorAdd" type="number" min="0" step="0.01" inputmode="decimal" required
                    placeholder="0.00">

                <label for="estoqueAdd">Estoque</label>
                <input id="estoqueAdd" type="number" min="0" step="1" inputmode="numeric" required
                    placeholder="0">

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitulo">
        <div class="modal-content">
        <h2 id="modalEditarTitulo">Editar Produto</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label class="full" for="descricaoEdit">Descrição</label>
            <input class="full" id="descricaoEdit" type="text" maxlength="100" required>

            <label for="unidadeEdit">Unidade</label>
            <input id="unidadeEdit" type="text" maxlength="10">

            <label for="valorEdit">Valor Unitário</label>
            <input id="valorEdit" type="number" min="0" step="0.01" inputmode="decimal" required>

            <label for="estoqueEdit">Estoque</label>
            <input id="estoqueEdit" type="number" min="0" step="1" inputmode="numeric" required>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/produtos.js"></script>

</body>

</html>
