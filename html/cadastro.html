<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - NV Store</title>
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Criar Conta</h2>
      <p class="subtitle">Preencha os dados abaixo para se cadastrar</p>
      <div id="alert-message" class="alert hidden"></div>
      <form id="form-cadastro" novalidate>
        <div class="input-group">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" placeholder="Como você vai entrar no sistema" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="input-group">
          <label for="confirmar-senha">Confirmar Senha</label>
          <input type="password" id="confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>
      <div class="auth-footer">
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
      </div>
    </div>
  </div>
  <script src="../js/cadastro.js"></script>
</body>
</html>
