<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidades - NV Store</title>

    <link rel="stylesheet" href="../css/cidades_style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html" class="active">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>
        <a href="./items.html">Itens de Pedidos</a>
        <a href="./produtos.html">Produtos</a>


    </nav>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Cidades</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Cidade</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th class="col-principal">Nome</th>
                <th>UF</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar" role="dialog" aria-modal="true" aria-labelledby="modalAdicionarTitulo">
        <div class="modal-content">
            <h2 id="modalAdicionarTitulo">Adicionar Cidade</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <label class="full" for="nomeAdd">Nome</label>
                <input class="full" id="nomeAdd" type="text" maxlength="80" required placeholder="Nome da cidade">

                <label for="ufAdd">UF</label>
                <input id="ufAdd" type="text" maxlength="2" minlength="2" pattern="[A-Za-z]{2}"
                    style="text-transform:uppercase" required placeholder="MG"
                    title="Informe a sigla do estado com 2 letras, ex: MG">

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitulo">
        <div class="modal-content">
        <h2 id="modalEditarTitulo">Editar Cidade</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label class="full" for="nomeEdit">Nome</label>
            <input class="full" id="nomeEdit" type="text" maxlength="80" required>

            <label for="ufEdit">UF</label>
            <input id="ufEdit" type="text" maxlength="2" minlength="2" pattern="[A-Za-z]{2}"
                style="text-transform:uppercase" required
                title="Informe a sigla do estado com 2 letras, ex: MG">

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/cidades.js"></script>

</body>

</html>
