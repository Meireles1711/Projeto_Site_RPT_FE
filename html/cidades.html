<body>

    <div class="layout">
    <nav class="menu">

        <a href="./index.html">Clientes</a>

        <div class="conteiner">
    
        <div class="card">
    
        <div class="topo">
        <h1>Cidades</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Cidade</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>UF</th>
                
            </tr>
        </thead>
    
        <tbody id="tabelaTipos">
    
        </tbody>
    </table>
    </div>
    </div>
    
    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Cidade</h2>
            <Label>Nome</Label>
            <input id="nomeAdd">
            <Label>Uf</Label>
            <input id="ufAdd">
    
           
    
           
    
            <div class="modal-buttons">
                <button onclick="fecharModal('modalAdicionar')">Cancelar</button>
                <button onclick="criar()">Salvar</button>    
            </div>
    
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Cidade</h2>
        <input id="idEdit" hidden>
    
        <Label>Nome</Label>
        <input id="nomeEdit">
        <Label>Uf</Label>
        <input id="ufEdit">
    
       
    
        <div class="modal-buttons">
            <button onclick="fecharModal('modalEditar')">Cancelar</button>
            <button onclick="atualizar()">Atualizar</button>
        </div>
    
    </div>
    </div>

        </div>
