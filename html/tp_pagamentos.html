<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV Store</title>

    <link rel="stylesheet" href="../css/tp-pagamento.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./tp_pagamentos.html">Tipos de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>

    </nav>

    <main class="conteudo">
        <div class="">
        <div class="cabecalho">

            <h2>Tipos Pagamento</h2>

            <button id="abrirCadastro" class="botao">
                Novo Tipo de Pagamento
            </button>

        </div>
        </div>

        <section class="listaTipos">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        
                    </tr>

                </thead>

                <tbody id="tabelaTipos">

                    <tr>

                        <td>1</td>
                        <td>Pix</td>
                       

                        <td>

                            <button class="editar">Editar</button>

                            <button class="excluir">Excluir</button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <div class="modal" id="modalCadastro">

        <div class="conteudoModal">

            <span id="fecharCadastro">&times;</span>

            <h2>Novo Cliente</h2>

            <form class="formCad">

                <label for="Descrição">Descrição</label>
                <input type="text" id="nome">

                

                <div class="botoesForm">

                    <button type="button" id="cancelar">
                        Cancelar
                    </button>

                    <button type="submit" class="formBotao">
                        Cadastrar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../JS/Tipos-p.js"></script>

</body>

</html>
