<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='../css/pedido_style.css'>
    <script src='../script.js'></script>
</head>
<body>

    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>

    </nav>

    <body>
        <div class="conteiner">
    
        <div class="card">
    
        <div class="topo">
        <h1>Pedidos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Pedido</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Cliente</th>
                <th>Condição Pagamento</th>
                <th>Forma Pagamento</th>
                <th>Prazo Entrega</th>
                
            </tr>
        </thead>
    
        <tbody id="tabelaTipos">
    
        </tbody>
    </table>
    </div>
    </div>
    
    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Pedido</h2>
            <Label>Data</Label>
            <input id="dataAdd">

            <Label>Cliente id</Label>
            <input id="clienteAdd">
            
            <Label>Condicao Pagamento id</Label>
            <input id="condicaoAdd">

            <Label>Forma Pagamento id</Label>
            <input id="formaAdd">
           
            <Label> Prazo Entrega</Label>
            <input id="prazoAdd">

            
    
           
    
           
    
            <div class="modal-buttons">
                <button onclick="fecharModal('modalAdicionar')">Cancelar</button>
                <button onclick="criar()">Salvar</button>    
            </div>
    
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Pedido</h2>
        <input id="idEdit" hidden>
    
        <Label>Descrição</Label>
        <input id="descricaoEdit">
    
       
    
        <div class="modal-buttons">
            <button onclick="fecharModal('modalEditar')">Cancelar</button>
            <button onclick="atualizar()">Atualizar</button>
        </div>
    
    </div>
    </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../java/pedidos.js"></script>

</body>
</html>
