<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV Store</title>

    <link rel="stylesheet" href="../css/pedido_style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html" class="active">Pedidos</a>
        <a href="./items.html">Items Pedidos</a>
        <a href="./produtos.html">Produtos</a>

    </nav>

        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Pedidos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar Pedido</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>Data</th>
                <th class="col-principal">Cliente</th>
                <th>Condição Pagamento</th>
                <th>Forma Pagamento</th>
                <th>Prazo Entrega</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar">
        <div class="modal-content">
            <h2>Adicionar Pedido</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <label>Data</label>
                <input id="dataAdd" type="date" required>

                <label>Prazo Entrega</label>
                <input id="prazoAdd" type="date">

                <!-- Selects alimentados via JS a partir das listas já cadastradas -->
                <label>Cliente</label>
                <select id="clienteAdd" required>
                    <option value="" selected disabled>Selecione um cliente...</option>
                </select>

                <label>Condição de Pagamento</label>
                <select id="condicaoAdd" required>
                    <option value="" selected disabled>Selecione...</option>
                </select>

                <label>Forma de Pagamento</label>
                <select id="formaAdd" required>
                    <option value="" selected disabled>Selecione...</option>
                </select>

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar">
        <div class="modal-content">
        <h2>Editar Pedido</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label>Data</label>
            <input id="dataEdit" type="date" required>

            <label>Prazo Entrega</label>
            <input id="prazoEdit" type="date">

            <label>Cliente</label>
            <select id="clienteEdit" required>
                <option value="" selected disabled>Selecione um cliente...</option>
            </select>

            <label>Condição de Pagamento</label>
            <select id="condicaoEdit" required>
                <option value="" selected disabled>Selecione...</option>
            </select>

            <label>Forma de Pagamento</label>
            <select id="formaEdit" required>
                <option value="" selected disabled>Selecione...</option>
            </select>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/pedidos.js"></script>

</body>
</html>
