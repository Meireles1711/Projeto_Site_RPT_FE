<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/condicoes-p.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
    <nav class="menu">

        <img src="../images/logo.png" alt="Logo">

        <h1>NV Store</h1>

        <a href="./index.html">Clientes</a>
        <a href="./cidades.html">Cidades</a>
        <a href="./condicoes-p.html" class="active">Condições de Pagamento</a>
        <a href="./tp_pagamentos.html">Formas de Pagamento</a>
        <a href="./pedidos.html">Pedidos</a>
        <a href="./items.html">Itens de Pedidos</a>
        <a href="./produtos.html">Produtos</a>

    </nav>


        <div class="conteiner">

        <div class="card">

        <div class="topo">
        <h1>Condições de Pagamentos</h1>
        <button onclick="abrirModalAdicionar()">Adicionar condição de Pagamento</button>
    </div>
    <table>
        <thead>
            <tr>
                <th class="col-id">ID</th>
                <th class="col-principal">Descrição</th>

            </tr>
        </thead>

        <tbody id="tabelaTipos">

        </tbody>
    </table>
    </div>
    </div>

    <div class="modal" id="modalAdicionar" role="dialog" aria-modal="true" aria-labelledby="modalAdicionarTitulo">
        <div class="modal-content">
            <h2 id="modalAdicionarTitulo">Adicionar Condição Pagamento</h2>
            <form id="formAdicionar" onsubmit="criar(); return false;">

                <label class="full" for="descricaoAdd">Descrição</label>
                <input class="full" id="descricaoAdd" type="text" maxlength="100" required
                    placeholder="Ex: À vista, 30/60/90 dias...">

                <div class="modal-buttons">
                    <button type="button" onclick="fecharModal('modalAdicionar')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <div class="modal" id="modalEditar" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitulo">
        <div class="modal-content">
        <h2 id="modalEditarTitulo">Editar Condição de Pagamento</h2>
        <form id="formEditar" onsubmit="atualizar(); return false;">

            <input id="idEdit" hidden>

            <label class="full" for="descricaoEdit">Descrição</label>
            <input class="full" id="descricaoEdit" type="text" maxlength="100" required>

            <div class="modal-buttons">
                <button type="button" onclick="fecharModal('modalEditar')">Cancelar</button>
                <button type="submit">Atualizar</button>
            </div>

        </form>
    </div>
    </div>

        </div>

    <footer>

        © Pertence a Meireles Enterprises

    </footer>

    <script src="../js/utils.js"></script>
    <script src="../js/condicoes-p.js"></script>

</body>

</html>
